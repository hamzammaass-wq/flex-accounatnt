name: Temporary Voucher Analytics Fix

on:
  push:
    branches:
      - fix/financial-report-voucher-analytics-20260912

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/financial-report-voucher-analytics-20260912
          fetch-depth: 0
      - name: Patch FinancialReports voucher categories
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/FinancialReports.tsx')
          s = p.read_text()
          old = """        const receiptVoucherIds = new Set(inRangeTransactions.filter(t => t.category === 'receipt').map(t => t.voucherId || t.id));
        const paymentVoucherIds = new Set(inRangeTransactions.filter(t => t.category === 'payment').map(t => t.voucherId || t.id));

        const receiptsTotal = inRangeTransactions
            .filter(t => t.category === 'receipt')
            .reduce((sum, t) => sum + (t.amount * (t.exchangeRate || 1)), 0);
        const paymentsTotal = inRangeTransactions
            .filter(t => t.category === 'payment')
            .reduce((sum, t) => sum + (t.amount * (t.exchangeRate || 1)), 0);"""
          new = """        const isReceiptVoucher = (t: Transaction) => t.category === 'receipt' || t.category === 'voucher_receipt';
        const isPaymentVoucher = (t: Transaction) => t.category === 'payment' || t.category === 'voucher_payment';
        const receiptVoucherIds = new Set(inRangeTransactions.filter(isReceiptVoucher).map(t => t.voucherId || t.id));
        const paymentVoucherIds = new Set(inRangeTransactions.filter(isPaymentVoucher).map(t => t.voucherId || t.id));

        const receiptsTotal = inRangeTransactions
            .filter(isReceiptVoucher)
            .reduce((sum, t) => sum + (t.amount * (t.exchangeRate || 1)), 0);
        const paymentsTotal = inRangeTransactions
            .filter(isPaymentVoucher)
            .reduce((sum, t) => sum + (t.amount * (t.exchangeRate || 1)), 0);"""
          if old not in s:
              raise SystemExit('Target block not found; refusing unsafe patch')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temporary-fix-voucher-analytics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/FinancialReports.tsx .github/workflows/temporary-fix-voucher-analytics.yml
          git commit -m "fix: include voucher categories in financial analytics"
          git push origin HEAD:fix/financial-report-voucher-analytics-20260912
