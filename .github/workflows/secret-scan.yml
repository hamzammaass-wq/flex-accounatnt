name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-tree:
    name: Scan current source tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Scan the checked-out tree rather than Git history. Known historical
      # exposures must be handled separately by rotating credentials first.
      - name: Detect hardcoded secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: dir --redact --no-banner --verbose /github/workspace
