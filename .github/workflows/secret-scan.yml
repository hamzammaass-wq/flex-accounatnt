name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-tree:
    name: Scan current source tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Archive only files tracked by the current commit. This deliberately avoids
      # scanning known historical exposure; rotation/history cleanup are separate.
      - name: Package current source tree
        run: git archive --format=tar --output=current-tree.tar HEAD

      - name: Detect hardcoded secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: dir --config=/github/workspace/.gitleaks.toml --redact --no-banner --verbose --max-archive-depth=1 /github/workspace/current-tree.tar
