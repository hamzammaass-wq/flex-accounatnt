# This file was auto-generated by the Firebase CLI

name: Flake Guard
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: flake-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_SMOKE_BROWSER_ATTEMPTS: '3'
  E2E_SMOKE_STEP_RETRIES: '3'
  E2E_SMOKE_RETRY_DELAY_MS: '500'
  E2E_CRITICAL_BROWSER_ATTEMPTS: '3'
  E2E_CRITICAL_STEP_RETRIES: '3'
  E2E_CRITICAL_RETRY_DELAY_MS: '500'
  FLAKE_GUARD_SMOKE_RUNS: '3'
  FLAKE_GUARD_CRITICAL_RUNS: '3'

permissions:
  contents: read

jobs:
  flake_guard:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run ci:build
      - name: Run flake guard
        env:
          E2E_ARTIFACTS_DIR: artifacts/e2e
        run: npm run flake:guard
      - name: Upload flake guard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-guard-e2e-artifacts
          path: artifacts/e2e
          if-no-files-found: warn
          retention-days: 21
      - name: Append flake guard summary
        if: always()
        run: |
          {
            echo "## Flake Guard"
            echo "- Smoke strict runs: $FLAKE_GUARD_SMOKE_RUNS"
            echo "- Critical strict runs: $FLAKE_GUARD_CRITICAL_RUNS"
            if [ -f artifacts/e2e/flake-guard/summary.md ]; then
              echo ""
              cat artifacts/e2e/flake-guard/summary.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"