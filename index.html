<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#030B1A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>المحاسب الذكي (AIFLEX Smart Accountant)</title>
    <link rel="manifest" href="/manifest.webmanifest?v=20260318-brand-v4" />
    <link rel="icon" href="/icons/favicon-32.png?v=20260318-brand-v4" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260318-brand-v4" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function () {
        var BOOT_RECOVERY_KEY = 'al_mohaseb_boot_recovery_once';
        var CHUNK_LOAD_ERROR_PATTERN = /(Loading chunk|ChunkLoadError|Failed to fetch dynamically imported module|Importing a module script failed|Unexpected token '<')/i;

        function recoverBoot() {
          var attempts = 0;
          try {
            attempts = Number(sessionStorage.getItem(BOOT_RECOVERY_KEY) || '0');
          } catch (error) {
            attempts = 0;
          }
          if (attempts >= 1) return;

          try {
            var lastReload = localStorage.getItem('al_mohaseb_last_recovery_reload');
            if (lastReload) {
              var diff = Date.now() - Number(lastReload);
              if (diff < 15000) return;
            }
            localStorage.setItem('al_mohaseb_last_recovery_reload', String(Date.now()));
          } catch (e) {
            // Ignore storage failures
          }

          try {
            sessionStorage.setItem(BOOT_RECOVERY_KEY, String(attempts + 1));
          } catch (error) {
            // Ignore storage failures and continue recovery.
          }

          var swPromise = Promise.resolve();
          if ('serviceWorker' in navigator) {
            swPromise = navigator.serviceWorker
              .getRegistrations()
              .then(function (registrations) {
                return Promise.all(registrations.map(function (registration) {
                  return registration.unregister().catch(function () { return false; });
                }));
              })
              .catch(function () { return undefined; });
          }

          var cachePromise = Promise.resolve();
          if ('caches' in window) {
            cachePromise = caches
              .keys()
              .then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              })
              .catch(function () { return undefined; });
          }

          Promise.all([swPromise, cachePromise]).finally(function () {
            var cleanUrl = window.location.origin + window.location.pathname + window.location.hash;
            window.location.replace(cleanUrl);
          });
        }

        window.__bootRecovery = recoverBoot;

        window.addEventListener('error', function (event) {
          var target = event && event.target;
          var isScriptLoadFailure = false;
          if (typeof HTMLScriptElement !== 'undefined' && target instanceof HTMLScriptElement) {
            var src = target.src || '';
            var isLocal = src.indexOf(window.location.origin) === 0 || src.indexOf('/') === 0 || !/^https?:\/\//i.test(src);
            if (isLocal) {
              isScriptLoadFailure = true;
            }
          }
          var message = String((event && event.message) || '');
          if (isScriptLoadFailure || CHUNK_LOAD_ERROR_PATTERN.test(message)) {
            recoverBoot();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var message = typeof reason === 'string' ? reason : String((reason && reason.message) || '');
          if (CHUNK_LOAD_ERROR_PATTERN.test(message)) {
            event.preventDefault();
            recoverBoot();
          }
        });

        window.addEventListener('load', function () {
          window.setTimeout(function () {
            var root = document.getElementById('root');
            var hasRenderedContent = !!(root && root.childNodes && root.childNodes.length > 0);
            if (!hasRenderedContent) {
              recoverBoot();
            }
          }, 7000);
        });
      })();
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap');

      body {
        font-family: 'Cairo', 'Tajawal', sans-serif;
        background-color: #f3f4f6;
        -webkit-tap-highlight-color: transparent;
      }

      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none !important;
        margin: 0 !important;
      }

      input[type=number] {
        -moz-appearance: textfield !important;
      }

      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 20px;
      }

      .transition-all {
        transition-duration: 200ms;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx" onerror="window.__bootRecovery && window.__bootRecovery()"></script>
  </body>
</html>
